# Calibration for the Quickie Q500M on drive profile 3, speed setting 3.
# For another chair, profile or speed setting, copy this file and change the
# numbers. The README explains how (see "Using your own calibration").
#
# Forward and reverse were read off the chair display with one rider seated.
#
# A positive angular.z (counter-clockwise) gives a negative left_right.
/**:
  ros__parameters:
    # Joystick value is a percentage of the profile's top speed.
    max_forward_speed: 1.028   # m/s (2.3 mph)
    max_reverse_speed: 0.313   # m/s (0.7 mph)
    # The chair won't turn below the dead zone, then speeds up to the top rate.
    max_turn_rate: 0.524       # rad/s at joystick 100
    turn_dead_zone: 18.0       # joystick units
    js_min: -100
    js_max: 100
    # Send zero if no cmd_vel arrives for this many seconds (0 turns it off).
    cmd_vel_timeout: 0.5
    # 1 = autonomous remote, 5 = shared remote.
    input_source: 1
